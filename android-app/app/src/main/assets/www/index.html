<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>宝可梦 · NFC 宠物</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 宠物渲染画布（透明，覆盖全屏） -->
  <canvas id="pet-canvas"></canvas>

  <!-- 顶部状态栏 -->
  <header id="top-bar">
    <div class="logo"><span class="logo-bolt">⚡</span> NFC 宠物</div>
    <div id="nfc-status" class="status">初始化 NFC…</div>
  </header>

  <!-- 待机提示（宠物未出现时显示） -->
  <div id="tap-prompt">
    <div class="nfc-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 8a5 5 0 0 1 10 0"/>
        <path d="M9 11a3 3 0 0 1 6 0"/>
        <circle cx="12" cy="15" r="1.4" fill="#00d4ff" stroke="none"/>
      </svg>
    </div>
    <h2>碰一下手环</h2>
    <p>唤醒你的宝可梦伙伴</p>
    <button id="simulate-btn" class="sim-btn hidden" type="button">桌面调试 · 模拟 NFC</button>
    <div class="prompt-cue">
      <span class="arrow"></span>
      <span>支持 Android Chrome + HTTPS</span>
    </div>
  </div>

  <!-- 底部信息卡（宠物出现后显示） -->
  <div id="info-card" class="hidden">
    <div class="info-row">
      <div class="info-text">
        <span class="name" id="pet-name">皮卡丘</span>
        <span class="type" id="pet-type">电系 · NFC 伙伴</span>
      </div>
      <div class="info-actions">
        <button id="pet-btn" type="button" title="摸摸它">🫳</button>
        <button id="wave-btn" type="button" title="打招呼">👋</button>
        <button id="dismiss-btn" type="button" title="收起">✕</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
