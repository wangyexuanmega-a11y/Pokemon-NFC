<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>宝可梦 · NFC 宠物</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 宠物渲染画布（悬浮窗模式用） -->
  <canvas id="pet-canvas"></canvas>

  <!-- 顶部状态栏 -->
  <header id="top-bar">
    <div class="logo"><span class="logo-bolt">⚡</span> NFC 宠物</div>
    <div class="top-right">
      <div id="steps-badge" class="steps hidden">🚶 <span id="steps-count">0</span></div>
      <div id="nfc-status" class="status">初始化…</div>
      <button id="close-app-btn" class="corner-close hidden" type="button" title="关闭">✕</button>
    </div>
  </header>

  <!-- 宝可梦图鉴选择界面 -->
  <div id="selection-screen">
    <div class="ss-head">
      <div class="ss-title">选择你的伙伴</div>
      <input id="search-input" type="search" placeholder="搜索名称 / 编号" autocomplete="off">
    </div>

    <!-- 展示平台：宝可梦在这里展示，可用下方滑块缩放大小 -->
    <div id="stage">
      <canvas id="stage-canvas"></canvas>
    </div>
    <div id="scale-row">
      <span class="scale-label">大小</span>
      <input id="scale-slider" type="range" min="50" max="185" step="5" value="100">
      <span class="scale-value" id="scale-value">100%</span>
    </div>

    <!-- 步数 → 神奇糖果 -->
    <div id="resource-row">
      <span class="res-item res-candy"><img src="sprites/item/rare-candy.png" class="res-ico" alt="糖果"> <b id="candy-count">0</b></span>
      <span class="res-item">剩余步数 <b id="steps-left">0</b></span>
      <button id="exchange-btn" type="button">换糖果</button>
    </div>

    <div id="buddy-grid"></div>
    <p class="ss-hint">选择后宠物会出现在桌面上（悬浮窗，可拖拽）<br>碰一下 NFC 手环也能直接唤醒<br>走路攒步数 → 兑换神奇糖果 → 升级进化！</p>
  </div>

  <!-- 控制卡片 -->
  <div id="control-card" class="hidden">
    <div class="cc-line">
      <div class="cc-name" id="cc-name">妙蛙种子 · No.001</div>
      <div class="cc-level" id="cc-level">Lv.1</div>
    </div>
    <div class="cc-actions">
      <button id="levelup-btn" type="button">升级（1🍬）</button>
      <button id="evolve-btn" type="button" class="hidden">进化</button>
      <button id="dismiss-btn" type="button">收起宠物</button>
      <button id="back-btn" type="button" class="secondary">换一只</button>
    </div>
  </div>

  <!-- 悬浮宠物右上角关闭按钮（overlay 模式显示） -->
  <button id="overlay-close" class="overlay-close" type="button" title="收起宠物">✕</button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
