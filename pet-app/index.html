<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>宝可梦 · NFC 宠物</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 宠物渲染画布（透明） -->
  <canvas id="pet-canvas"></canvas>

  <!-- 顶部状态栏 -->
  <header id="top-bar">
    <div class="logo"><span class="logo-bolt">⚡</span> NFC 宠物</div>
    <div id="nfc-status" class="status">初始化…</div>
  </header>

  <!-- 宝可梦选择界面 -->
  <div id="selection-screen">
    <div class="ss-title">选择你的伙伴</div>
    <div id="buddy-grid"></div>
    <p class="ss-hint">选择后会以悬浮宠物出现在屏幕上<br>碰一下 NFC 手环也能直接唤醒</p>
  </div>

  <!-- 控制卡片 -->
  <div id="control-card" class="hidden">
    <div class="cc-name" id="cc-name">妙蛙种子</div>
    <div class="cc-actions">
      <button id="pet-btn" type="button">摸摸它</button>
      <button id="wave-btn" type="button">打招呼</button>
      <button id="dismiss-btn" type="button">收起宠物</button>
      <button id="back-btn" type="button" class="secondary">换一只</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
